name: 打包 Windows 版

on:
  push:
    tags:
      - "v*"          # 推 tag（如 v0.1.0）时触发
  workflow_dispatch:    # 也可以手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 用 PyInstaller 打包
        run: pyinstaller --noconfirm potatospire.spec

      - name: 压缩产物
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Potatospire\*" -DestinationPath "potatospire-win.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: potatospire-win
          path: potatospire-win.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: potatospire-win.zip
